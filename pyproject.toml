[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenerbahce-coach-lab"
version = "0.1.0"
description = "Kaynaklı teknik direktör verileri, açıklanabilir sıralama ve keşifsel ML"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["fbcoach*"]
